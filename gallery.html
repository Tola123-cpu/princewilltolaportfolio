<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gallery | Princewill Tola</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gallery.style.css">
</head>
<body>

    <!-- Top Utility Bar -->
    <header class="top-bar">
        <div class="brand">PRINCEWILL TOLA</div>
        <div class="status-indicator">STATUS: <span class="live-dot"></span> AVAILABLE FOR HIRE</div>
    </header>

    <!-- Main Gallery Workspace (Instagram Grid Style) -->
    <main class="gallery-workspace">
        <div class="gallery-container">
            
            <div class="section-title-wrapper">
                <h1 class="gallery-header">REELS & GALLERY</h1>
                <p class="gallery-sub">Tap any video to view my previous projects</p>
            </div>

            <!-- IG Grid Layout (Rows & Columns) -->
            <div class="ig-grid">

                <!-- GRID ITEM 1 -->
                <div class="ig-grid-item" onclick="openModal(0)">
                    <video class="grid-thumb" muted preload="metadata">
                        <source src="reel1.mp4" type="video/mp4">
                    </video>
                    <div class="grid-overlay">
                        <span class="ig-icon">▶</span>
                    </div>
                </div>

                <!-- GRID ITEM 2 -->
                <div class="ig-grid-item" onclick="openModal(1)">
                    <video class="grid-thumb" muted preload="metadata">
                        <source src="reel2.mp4" type="video/mp4">
                    </video>
                    <div class="grid-overlay">
                        <span class="ig-icon">▶</span>
                    </div>
                </div>

                <!-- GRID ITEM 3 -->
                <div class="ig-grid-item" onclick="openModal(2)">
                    <video class="grid-thumb" muted preload="metadata">
                        <source src="reel1.mp4" type="video/mp4">
                    </video>
                    <div class="grid-overlay">
                        <span class="ig-icon">▶</span>
                    </div>
                </div>

                <!-- GRID ITEM 4 -->
                <div class="ig-grid-item" onclick="openModal(3)">
                    <video class="grid-thumb" muted preload="metadata">
                        <source src="reel2.mp4" type="video/mp4">
                    </video>
                    <div class="grid-overlay">
                        <span class="ig-icon">▶</span>
                    </div>
                </div>

                <!-- GRID ITEM 5 -->
                <div class="ig-grid-item" onclick="openModal(4)">
                    <video class="grid-thumb" muted preload="metadata">
                        <source src="reel1.mp4" type="video/mp4">
                    </video>
                    <div class="grid-overlay">
                        <span class="ig-icon">▶</span>
                    </div>
                </div>

                <!-- GRID ITEM 6 -->
                <div class="ig-grid-item" onclick="openModal(5)">
                    <video class="grid-thumb" muted preload="metadata">
                        <source src="reel2.mp4" type="video/mp4">
                    </video>
                    <div class="grid-overlay">
                        <span class="ig-icon">▶</span>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- IMMERSIVE IG PLAYER MODAL -->
    <div id="reelModal" class="modal-backdrop">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <button class="modal-nav prev-btn" onclick="prevReel()">❮</button>
        
        <div class="modal-content-frame">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <div class="playhead-line"></div>
            
            <video id="modalVideo" class="modal-video-player" controls autoplay playsinline>
                <source id="modalSource" src="" type="video/mp4">
            </video>
        </div>

        <button class="modal-nav next-btn" onclick="nextReel()">❯</button>
    </div>

    <!-- CapCut-Style Timeline Navbar Fixed at the Bottom -->
    <nav class="timeline-nav">
        <div class="timeline-header">
            <span>TIMELINE TRACK V1</span>
            <span class="zoom-level">100%</span>
        </div>
        <div class="timeline-tracks">
            <a href="index.html" class="clip">
                <span class="clip-label">Home</span>
                <span class="cut-marker"></span>
            </a>
            <a href="about.html" class="clip">
                <span class="clip-label">About Me</span>
                <span class="cut-marker"></span>
            </a>
            <a href="services.html" class="clip">
                <span class="clip-label">Services</span>
                <span class="cut-marker"></span>
            <a href="gallery.html" class="clip active">
                <span class="clip-label">Gallery & Works</span>
                <span class="cut-marker"></span>
            </a>
            <a href="contact.html" class="clip">
                <span class="clip-label">Contact Me</span>
                <span class="cut-marker"></span>
            </a>
        </div>
    </nav>

    <!-- JavaScript File -->
    <script src="gallery.script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Princewill Tola | Creative Director, Videographer/Photographer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Fading Video Element -->
    <div class="video-bg-container">
        <video autoplay muted loop playsinline class="bg-video">
            <!-- Make sure your video file is named background.mp4 or change it here -->
            <source src="background.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Top Utility Bar -->
    <header class="top-bar">
        <div class="brand">PRINCEWILL TOLA</div>
        <div class="status-indicator">STATUS: <span class="live-dot"></span> AVAILABLE FOR HIRE</div>
    </header>

    <!-- Main Content Area -->
    <main class="workspace">
        
        <!-- Top Area: The H1 Big Headline (Retype Text) -->
        <div class="headline-container">
            <span id="typed-text" class="typed-header"></span><span class="cursor">|</span>
        </div>

        <!-- Middle Area: Perfectly Centered Proportional Layout -->
        <section class="middle-row">
            
            <!-- Left: Name in Horizontal Form (Two Lines) + Small Intro Text -->
            <div class="side-label left-label">
                <span class="line-1">Princewill</span>
                <span class="line-2">Tola</span>
                <div class="intro-text">
                    Creative direction for brands that can't afford to look ordinary<br>Visual stories for luxury, real estate, and brands that move fast.
                </div>
            </div>
            
            <!-- Center Canvas: The Profile Picture -->
            <div class="canvas-section">
                <div class="canvas-frame">
                    <div class="corner tl"></div><div class="corner tr"></div>
                    <div class="corner bl"></div><div class="corner br"></div>
                    <div class="playhead-line"></div>
                    <div class="canvas-image-wrapper">
                        <!-- Replace 'profile.jpg' with your actual image file name -->
                        <img src="profile.jpg" alt="Princewill Tola" class="portfolio-img">
                    </div>
                </div>
            </div>

            <!-- Right: Location in Horizontal Form (Two Lines) -->
            <div class="side-label right-label">
                <span class="line-1">Location:</span>
                <span class="line-2">Lagos, Nigeria</span>
            </div>
        </section>

    </main>

    <!-- CapCut-Style Timeline Navbar Fixed at the Bottom -->
    <nav class="timeline-nav">
        <div class="timeline-header">
            <span>TIMELINE TRACK V1</span>
            <span class="zoom-level">100%</span>
        </div>
        <div class="timeline-tracks">
            <a href="#home" class="clip active">
                <span class="clip-label">Home</span>
                <span class="cut-marker"></span>
            </a>
            <a href="about.html" class="clip">
                <span class="clip-label">About Me</span>
                <span class="cut-marker"></span>
            </a>
            <a href="#projects" class="clip">
                <span class="clip-label">Services</span>
                <span class="cut-marker"></span>
            </a>
            <a href="#gallery" class="clip">
                <span class="clip-label">Gallery & Works</span>
                <span class="cut-marker"></span>
            </a>
            <a href="contact.html" class="clip">
                <span class="clip-label">Contact Me</span>
                <span class="cut-marker"></span>
            </a>
        </div>
    </nav>

    <!-- JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
